# Opt-in mastery-loop filesystem Skill provider for DeepSeek Harness.
# Resolves the packaged Skill root from the installed npm identity anchored at
# the DSH profile (Loader baseUrl), never as a path concatenated onto baseUrl.
- insert:
    - id: mastery-loop-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: mastery-loop
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mastery-loop/package.json')), 'skills')
